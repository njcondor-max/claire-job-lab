<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claire's Job Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EF; --card:#FFFFFF; --ink:#2B2340; --ink2:#4A4060; --muted:#857A96; --line:#F0E6DA;
  --coral:#FF6B4A; --peach:#FFE6DB; --teal:#11A086; --mint:#DCF5EE; --sun:#F7B500; --butter:#FFF2C6;
  --lilac:#7457F5; --lav:#EEE9FF; --sky:#2E95E8; --skyl:#E2F1FD; --rose:#E5486D; --rosel:#FFE4EA;
  --r:18px; --shadow:0 1px 0 rgba(43,35,64,.04), 0 8px 24px -12px rgba(43,35,64,.18);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:
  radial-gradient(900px 400px at 100% -10%, #FFE1D2 0%, transparent 60%),
  radial-gradient(700px 380px at -10% 0%, #FFF0C2 0%, transparent 55%), var(--bg); min-height:100vh}
h1,h2,h3,h4{font-family:"Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
a{color:var(--sky)}
.wrap{max-width:1240px;margin:0 auto;padding:22px 22px 80px}

/* header */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{font-size:26px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500;margin-top:-2px}
.top .spacer{flex:1}
.statuspill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:#ccc;display:inline-block}
.dot.ok{background:var(--teal)} .dot.warn{background:var(--sun)} .dot.bad{background:var(--rose)}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:600;color:var(--ink2)}
.iconbtn:hover{border-color:#e4d4c2}
nav.tabs{display:flex;gap:6px;margin:20px 0 22px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px;overflow-x:auto;box-shadow:var(--shadow)}
nav.tabs button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-weight:700;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px}
nav.tabs button .ct{background:var(--peach);color:var(--coral);border-radius:999px;font-size:11.5px;padding:1px 7px}
nav.tabs button.on{background:var(--ink);color:#fff}
nav.tabs button.on .ct{background:var(--coral);color:#fff}
.banner{border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:13.5px;display:flex;gap:10px;align-items:center}
.banner.warn{background:var(--butter);color:#6b5000}
.banner.info{background:var(--skyl);color:#185d93}

/* cards & layout */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.5fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 .sub{font-family:"Plus Jakarta Sans";font-size:12.5px;color:var(--muted);font-weight:500;margin-left:auto}
.hero{background:linear-gradient(120deg,#FF8A5B 0%,#FF6B4A 45%,#F64F7A 100%);color:#fff;border:0;padding:24px 26px;position:relative;overflow:hidden}
.hero h2{font-size:30px;font-weight:800;line-height:1.15}
.hero p{margin:6px 0 0;opacity:.92;max-width:640px}
.hero .bubbles{position:absolute;right:-30px;top:-30px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .bubbles:after{content:"";position:absolute;left:-60px;top:140px;width:110px;height:110px;border-radius:50%;background:rgba(255,225,120,.35)}
.hero .stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.hero .stat{background:rgba(255,255,255,.18);border-radius:14px;padding:8px 14px;font-weight:600;font-size:13.5px}
.hero .stat b{font-size:20px;font-family:"Bricolage Grotesque";margin-right:5px}

.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.between{justify-content:space-between}
.empty{padding:18px;text-align:center;color:var(--muted);background:#FFFBF6;border:1.5px dashed var(--line);border-radius:14px;font-size:14px}

/* buttons */
.btn{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.coral{background:var(--coral)} .btn.teal{background:var(--teal)} .btn.lilac{background:var(--lilac)} .btn.sky{background:var(--sky)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.soft{background:var(--peach);color:#c2421f}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
a.btn{text-decoration:none}

/* chips/badges */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;background:#F5EFE8;color:var(--ink2)}
.chip.teal{background:var(--mint);color:#0c7562} .chip.coral{background:var(--peach);color:#c2421f}
.chip.sun{background:var(--butter);color:#7a5a00} .chip.lilac{background:var(--lav);color:#5235d6}
.chip.sky{background:var(--skyl);color:#1a6fb5} .chip.rose{background:var(--rosel);color:#b72a4e}
.chip.x{cursor:pointer}

/* actions */
.action{display:flex;gap:14px;align-items:center;padding:14px;border-radius:16px;background:#FFFBF6;border:1px solid var(--line);margin-bottom:10px}
.action .num{width:34px;height:34px;flex:0 0 34px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque";background:var(--butter);color:#7a5a00}
.action:nth-child(1) .num{background:var(--coral);color:#fff}
.action:nth-child(2) .num{background:var(--peach);color:#c2421f}
.action .body{flex:1;min-width:0}
.action .t{font-weight:700}
.action .w{font-size:12.5px;color:var(--muted)}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.mini:last-child{border-bottom:0}
.mini .t{font-weight:600;font-size:14px}

/* jobs */
.jobcard{display:grid;grid-template-columns:64px 1fr auto;gap:16px;align-items:start}
@media(max-width:700px){.jobcard{grid-template-columns:52px 1fr}.jobcard .acts{grid-column:1/-1}}
.ring{--p:50;--c:var(--teal);width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#F1EAE1 0);display:grid;place-items:center}
.ring span{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-family:"Bricolage Grotesque";font-size:17px}
.jobtitle{font-weight:800;font-size:17px;font-family:"Bricolage Grotesque"}
.jobmeta{color:var(--muted);font-size:13px;margin-top:2px}
.why{margin-top:10px;background:var(--lav);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#3a2a8a}
.why b{color:#5235d6}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:150px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 10px;font-weight:500;font-size:14px;min-width:0}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #FFC7B5;border-color:#FFB49C}

/* apply */
.applylayout{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:960px){.applylayout{grid-template-columns:1fr}}
.joblist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px}
.joblist button.on{border-color:var(--coral);background:#FFF4EF}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--muted)}
.subtabs button.on{background:var(--lav);border-color:#d8ceff;color:#5235d6}
.req{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.req:last-child{border-bottom:0}
.req .st{flex:0 0 74px}
textarea.doc{width:100%;min-height:420px;border:1px solid var(--line);border-radius:14px;padding:14px;font:13.5px/1.55 "Plus Jakarta Sans";background:#FFFDFB}
.guard{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.guard.ok{background:var(--mint);color:#0c6a58}
.guard.bad{background:var(--rosel);color:#9c1f3f}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.steps span{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F5EFE8;color:var(--muted)}
.steps span.done{background:var(--mint);color:#0c7562}

/* pipeline */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.lane{flex:0 0 230px;background:#FFFBF6;border:1px solid var(--line);border-radius:16px;padding:10px;min-height:200px}
.lane.over{background:var(--peach)}
.lane h4{font-size:13.5px;display:flex;justify-content:space-between;margin:2px 4px 10px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px;cursor:grab;box-shadow:0 2px 6px -4px rgba(0,0,0,.2)}
.pcard .c{font-size:12px;color:var(--muted)}
.pcard .t{font-weight:700;font-size:13.5px;line-height:1.3}
.pcard.stalled{border-color:#FFB49C;background:#FFF6F2}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(43,35,64,.35);z-index:50;display:flex;justify-content:flex-end}
.scrim.center{justify-content:center;align-items:center;padding:20px}
.drawer{width:min(560px,100%);height:100%;background:var(--bg);overflow:auto;padding:22px;box-shadow:-20px 0 40px -20px rgba(0,0,0,.3)}
.modal{width:min(640px,100%);max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px;padding:24px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}
.timeline .ev{position:relative;padding:4px 0 10px;font-size:13.5px}
.timeline .ev:before{content:"";position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--coral)}
.timeline .ev .d{font-size:11.5px;color:var(--muted)}

/* analytics */
.kpi{text-align:left}
.kpi .v{font-family:"Bricolage Grotesque";font-weight:800;font-size:30px;line-height:1.1}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:600}
.bar{height:12px;border-radius:999px;background:#F3ECE3;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:999px;background:var(--coral)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;color:var(--muted);font-size:12px;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 0.8s linear infinite}
.spin.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--lilac)}
@keyframes sp{to{transform:rotate(360deg)}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
hr.s{border:0;border-top:1px dashed var(--line);margin:14px 0}
/* Ask Claude — modern assistant panel */
#askBtn{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:45;width:min(560px,calc(100vw - 32px));display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;
  background:rgba(255,255,255,.86);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border:1px solid rgba(43,35,64,.10);border-radius:999px;
  box-shadow:0 1px 2px rgba(43,35,64,.06),0 18px 40px -18px rgba(43,35,64,.35);color:#8A8299;font:500 15px "Plus Jakarta Sans";text-align:left;transition:box-shadow .2s, transform .2s}
#askBtn:hover{box-shadow:0 1px 2px rgba(43,35,64,.06),0 22px 50px -18px rgba(43,35,64,.45);transform:translateX(-50%) translateY(-1px)}
#askBtn .spark{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center}
#askBtn .ph{flex:1}
#askBtn kbd{font:600 11px "Plus Jakarta Sans";color:#9A92A8;border:1px solid #E6E0EC;border-radius:6px;padding:2px 6px;background:#fff}
#askBtn .go{width:34px;height:34px;border-radius:50%;background:#2B2340;display:grid;place-items:center;flex:0 0 34px}
.wrap{padding-bottom:110px}

#askScrim{position:fixed;inset:0;background:rgba(30,24,44,.18);z-index:46;opacity:0;pointer-events:none;transition:opacity .25s}
#askScrim.open{opacity:1;pointer-events:auto}
#askPanel{position:fixed;top:12px;right:12px;bottom:12px;z-index:47;width:min(480px,calc(100vw - 24px));background:#FFFFFF;border:1px solid rgba(43,35,64,.08);border-radius:24px;
  box-shadow:0 30px 80px -30px rgba(30,24,44,.45);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 24px));transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#askPanel.open{transform:none}
@media(max-width:640px){#askPanel{top:0;right:0;bottom:0;width:100vw;border-radius:0}}
#askPanel .hd{display:flex;align-items:center;gap:10px;padding:16px 18px 12px}
#askPanel .hd .ttl{font:700 15px "Plus Jakarta Sans";color:#2B2340}
#askPanel .hd .sub{font-size:12px;color:#9A92A8}
#askPanel .hd .ib{margin-left:auto;display:flex;gap:4px}
#askPanel .hd .ib button{width:34px;height:34px;border-radius:10px;border:0;background:transparent;color:#7A7189;display:grid;place-items:center}
#askPanel .hd .ib button:hover{background:#F4F1F7;color:#2B2340}
#askPanel .msgs{flex:1;overflow:auto;padding:6px 22px 24px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.m-user{align-self:flex-end;max-width:85%;background:#F4F1F7;color:#2B2340;padding:10px 15px;border-radius:20px;font-size:15px;line-height:1.55;white-space:pre-wrap;word-wrap:break-word}
.m-ai{display:flex;gap:12px;align-items:flex-start}
.m-ai .av{width:26px;height:26px;flex:0 0 26px;margin-top:1px;display:grid;place-items:center}
.m-ai .tx{flex:1;min-width:0;font-size:15px;line-height:1.65;color:#2B2340;word-wrap:break-word}
.m-ai .tx p{margin:0 0 10px}.m-ai .tx p:last-child{margin-bottom:0}
.m-ai .tx ul{margin:4px 0 10px;padding-left:20px}.m-ai .tx li{margin:3px 0}
.m-ai .tx a{color:#5B3FE0;text-decoration:underline;text-underline-offset:2px}
.m-ai .tx b{font-weight:700}
.acts-done{margin-top:12px;border:1px solid #ECE8F0;border-radius:14px;overflow:hidden}
.acts-done div{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;font-size:13px;color:#4A4060;border-top:1px solid #F3F0F6}
.acts-done div:first-child{border-top:0}
.acts-done svg{flex:0 0 14px;margin-top:3px}
.thinking{font-size:14px;font-weight:600;background:linear-gradient(90deg,#B3A9C2 0%,#2B2340 45%,#B3A9C2 90%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 1.6s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.welcome{margin:auto 0;padding:10px 0}
.welcome h3{font:700 26px "Bricolage Grotesque";color:#2B2340;margin:14px 0 6px;letter-spacing:-.02em}
.welcome p{color:#857A96;margin:0 0 18px;font-size:14.5px}
.sugg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sugg button{text-align:left;border:1px solid #ECE8F0;background:#fff;border-radius:14px;padding:11px 12px;font:500 13.5px/1.35 "Plus Jakarta Sans";color:#3A3150;transition:background .15s,border-color .15s}
.sugg button:hover{background:#FAF8FC;border-color:#DCD4E6}
.sugg button span{display:block;font-size:16px;margin-bottom:4px}
#askPanel .ft{padding:10px 16px 16px}
.composer{border:1px solid #E6E0EC;border-radius:24px;background:#fff;box-shadow:0 2px 10px -6px rgba(43,35,64,.18);padding:10px 10px 10px 16px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s, box-shadow .15s}
.composer:focus-within{border-color:#CFC4E0;box-shadow:0 4px 18px -8px rgba(91,63,224,.35)}
.composer textarea{border:0;outline:0;resize:none;font:15px/1.5 "Plus Jakarta Sans";color:#2B2340;max-height:180px;min-height:24px;padding:4px 0;background:transparent}
.composer .cbar{display:flex;align-items:center;gap:8px}
.composer .hint{font-size:11.5px;color:#A79FB4}
.composer .send{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:#2B2340;display:grid;place-items:center;transition:opacity .15s, transform .1s}
.composer .send:disabled{opacity:.25;cursor:default}
.composer .send:not(:disabled):active{transform:scale(.94)}
.fine{text-align:center;font-size:11px;color:#A79FB4;margin-top:8px}@keyframes bl{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="23" fill="#FFC23D"/><circle cx="23" cy="23" r="12" fill="#FF6B4A"/><path d="M17 24.5l4 4 8-9" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>Claire's Job Lab</h1><small>Your personal career assistant</small></div>
    </div>
    <div class="spacer"></div>
    <span class="statuspill" id="budgetPill" style="display:none"></span>
    <span class="statuspill" id="savePill"><span class="dot warn"></span>Connecting…</span>
    <button class="iconbtn" data-act="openSettings">⚙︎ Lab settings</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="banners"></div>
  <main id="view"></main>
</div>
<div id="overlay"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="askGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5B"/><stop offset=".55" stop-color="#E5486D"/><stop offset="1" stop-color="#7457F5"/></linearGradient></defs></svg>
<button id="askBtn" data-act="askOpen" aria-label="Ask Claude"><span class="spark"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="url(#askGrad)" d="M12 2c.5 4.6 2.9 7.5 8 8.1v1.8c-5.1.6-7.5 3.5-8 8.1h-1.8c-.5-4.6-2.9-7.5-8-8.1v-1.8c5.1-.6 7.5-3.5 8-8.1H12z"/></svg></span><span class="ph">Ask Claude anything…</span><kbd id="askKbd">⌘K</kbd><span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></button>
<div id="askScrim" data-act="askClose"></div>
<aside id="askPanel" aria-label="Ask Claude" aria-hidden="true">
  <div class="hd"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="url(#askGrad)" d="M12 2c.5 4.6 2.9 7.5 8 8.1v1.8c-5.1.6-7.5 3.5-8 8.1h-1.8c-.5-4.6-2.9-7.5-8-8.1v-1.8c5.1-.6 7.5-3.5 8-8.1H12z"/></svg><div><div class="ttl">Ask Claude</div><div class="sub">Does it for you, or walks you through it</div></div>
    <div class="ib"><button data-act="askClear" title="New chat"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
    <button data-act="askClose" title="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
  <div class="msgs" id="askMsgs"></div>

    <div class="cbar"><span class="hint">Enter to send · Shift+Enter for a new line</span><button class="send" id="askSendBtn" data-act="askSend" disabled aria-label="Send"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></div>
    <div class="fine">Claude can make changes in your Lab, but never sends email or submits applications.</div></div>
</aside>
<div id="toastWrap"></div><div id="toastWrap"></div>

<script>
/* ===================== constants ===================== */
const STAGES = ["Discovered","Shortlisted","Preparing","Applied","Recruiter Contact","Interviewing","Final Round","Offer","Closed"];
const STAGE_LABEL = {Preparing:"Preparing Application", Closed:"Rejected / Closed"};
const ACTIVE_AFTER_APPLY = ["Applied","Recruiter Contact","Interviewing","Final Round","Offer"];
const RESPONDED = ["Recruiter Contact","Interviewing","Final Round","Offer"];
const TABS = [["today","☀️ Today"],["discover","🔍 Discover"],["apply","✍️ Apply"],["pipeline","🗂️ Pipeline"],["network","🤝 Network"],["analytics","📈 Analytics"]];
const DAY = 864e5;

/* ===================== state ===================== */
const S = {
  tab: (location.hash||"").replace("#","") || "today",
  prefs: null, resume: null, jobs: [], contacts: [], log: [],
  loaded: {prefs:false, resume:false, jobs:false, contacts:false, log:false},
  mode: "loading", // db (server) | local | loading
  budget: null, server: {}, boards: [], chat: [], chatBusy: false,
  inbox: [], events: [],
  ui: { applyJob:null, applySub:"fit", filters:{q:"",minScore:0,minSalary:"",mode:"",seniority:"",cat:"",showHidden:false,showExpired:false,missionOnly:false}, busy:{}, dirty:{} },
};
if (!TABS.some(t=>t[0]===S.tab)) S.tab = "today";

/* ===================== utils ===================== */
const $ = s => document.querySelector(s);
const h = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toISOString();
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const fmtD = iso => iso ? new Date(iso.length===10? iso+"T12:00:00" : iso).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
const daysSince = iso => iso ? Math.floor((Date.now()-new Date(iso.length===10? iso+"T12:00:00":iso))/DAY) : null;
const daysUntil = iso => iso ? Math.ceil((new Date(iso.length===10? iso+"T12:00:00":iso) - today0())/DAY) : null;
const addDays = (n, from=new Date()) => { const d=new Date(from); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const money = n => n==null||n==="" ? "" : "$"+Math.round(n/1000)+"k";
const slug = s => String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const uid = p => p+"-"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const stageLabel = s => STAGE_LABEL[s] || s;
function toast(msg){ const w=$("#toastWrap"); w.innerHTML=`<div class="toast">${h(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>w.innerHTML="",2600); }
function scoreColor(p){ return p>=80?"var(--teal)":p>=65?"var(--sun)":p>=50?"var(--coral)":"#C9BFD3"; }
function dedupeKey(j){ return slug(j.company)+"|"+slug(j.title)+"|"+slug(j.location); }
function greeting(){ const hr=new Date().getHours(); return hr<12?"Good morning":hr<17?"Good afternoon":"Good evening"; }
function jobById(id){ return S.jobs.find(j=>j.id===id); }
function lastActivity(j){ const hs=j.history||[]; return hs.length? hs[hs.length-1].at : (j.createdAt||j.verifiedAt); }
function isStalled(j){ return ACTIVE_AFTER_APPLY.includes(j.stage) && j.stage!=="Offer" && daysSince(lastActivity(j))>=14; }
function followDue(j){ return j.followUpDate && daysUntil(j.followUpDate)<=0 && ACTIVE_AFTER_APPLY.includes(j.stage); }
function salaryText(j){ if(j.salary) return j.salary; if(j.salaryMin||j.salaryMax) return [money(j.salaryMin),money(j.salaryMax)].filter(Boolean).join("–"); return ""; }

/* ===================== storage layer ===================== */
const LS_KEY = "claireJobLab.v1";
function lsLoad(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({prefs:S.prefs,resume:S.resume,jobs:S.jobs,contacts:S.contacts,log:S.log.slice(0,200)})); }catch(e){} }
const writeQ = {};
let pending = 0, lastWrite = 0;
async function api(method, url, body){
  const r = await fetch(url, {method, headers: body? {"content-type":"application/json"} : {}, body: body? JSON.stringify(body) : undefined, credentials:"same-origin"});
  if (r.status===401){ location.href="/login"; throw {code:"auth", message:"Please log in again."}; }
  const d = await r.json().catch(()=>({}));
  if (!r.ok) throw {code:d.code||"error", message:d.message||("Server error "+r.status), budget:d.budget};
  return d;
}
function queueWrite(path, data){
  if (S.mode!=="db"){ lsSave(); return Promise.resolve(); }
  const [coll, id] = path.split("/"); pending++; lastWrite=Date.now(); setSave("saving");
  const url = `/api/doc/${coll}/${encodeURIComponent(id)}`;
  const prev = writeQ[path] || Promise.resolve();
  const p = prev.catch(()=>{}).then(()=> data===null ? api("DELETE", url) : api("PUT", url, clone(data)))
    .then(()=>setSave("ok"))
    .catch(e=>{ setSave("bad", "Not saved — check your connection"); throw e; })
    .finally(()=>{ pending--; });
  writeQ[path] = p; return p;
}
function saveJob(j){ j.updatedAt=now(); const i=S.jobs.findIndex(x=>x.id===j.id); if(i<0) S.jobs.push(j); else S.jobs[i]=j; render(); return queueWrite("jobs/"+j.id, j); }
function saveContact(c){ c.updatedAt=now(); const i=S.contacts.findIndex(x=>x.id===c.id); if(i<0) S.contacts.push(c); else S.contacts[i]=c; render(); return queueWrite("contacts/"+c.id, c); }
function savePrefs(p){ S.prefs=p; render(); return queueWrite("config/prefs", p); }
function saveResume(r){ S.resume=r; render(); return queueWrite("config/resume", r); }
function logEvent(type, text, extra){
  const e = {id:uid("log"), at:now(), type, text, by:"Lab (you)", ...(extra||{})};
  S.log.unshift(e); render(); return queueWrite("log/"+e.id, e).catch(()=>{});
}
function setSave(state, msg){
  const el=$("#savePill"); if(!el) return;
  if (S.mode==="local"){ el.innerHTML=`<span class="dot warn"></span>Offline — saving in this browser`; return; }
  const m = {ok:["ok","All changes saved"], saving:["warn","Saving…"], bad:["bad",msg||"Not saved"]}[state];
  el.innerHTML=`<span class="dot ${m[0]}"></span>${h(m[1])}`;
}
function addHistory(j, text){ j.history = j.history||[]; j.history.push({at:now(), text}); }

function applyState(d){
  const cfg = Object.fromEntries((d.config||[]).map(x=>[x.id,x]));
  S.prefs = cfg.prefs||null; S.resume = cfg.resume||null; S.boards = (cfg.boards&&cfg.boards.list)||[];
  S.jobs = d.jobs||[]; S.jobs.forEach(j=>{ if(S.ui.dirty[j.id]) j.kit=clone(S.ui.dirty[j.id]); });
  S.contacts = d.contacts||[]; S.log = d.log||[]; S.budget = d.budget||S.budget; S.server = d.server||{};
  if (!S.chatBusy){ S.chat = (cfg.chat && cfg.chat.messages) || []; renderChat(); }
  Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);
}
async function boot(){
  render();
  try { applyState(await api("GET","/api/state")); S.mode="db"; setSave("ok"); }
  catch(e){ if (e.code==="auth") return; return useLocal(); }
  render(); maybeOnboard();
  setInterval(poll, 45000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) poll(); });
}
async function poll(){
  // Pick up new jobs from the daily search and edits from other devices — but never mid-edit.
  if (S.mode!=="db" || document.hidden || pending || Date.now()-lastWrite<4000) return;
  const a=document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (($("#imp_text")||{}).value) return;
  try { applyState(await api("GET","/api/state")); render(); } catch(e){}
}
function useLocal(){
  S.mode="local"; const d=lsLoad();
  Object.assign(S,{prefs:d.prefs||null,resume:d.resume||null,jobs:d.jobs||[],contacts:d.contacts||[],log:d.log||[]});
  Object.keys(S.loaded).forEach(k=>S.loaded[k]=true);
  banner("warn","Can’t reach the Lab server — showing an offline copy. Changes are saved in this browser only.");
  setSave(); render(); maybeOnboard();
}
const banners=[]; function banner(kind,text){ if(banners.some(b=>b.text===text)) return; banners.push({kind,text}); renderBanners(); }
function renderBanners(){ $("#banners").innerHTML = banners.map(b=>`<div class="banner ${b.kind}">${b.kind==="warn"?"⚠️":"ℹ️"} ${h(b.text)}</div>`).join(""); }

/* ===================== Claude (sample) helpers ===================== */
function resumeText(){ return (S.resume && S.resume.text) || ""; }
async function askJSON(prompt, opts={}){
  if (S.mode!=="db") throw {code:"not_granted", message:"Claude isn’t available offline."};
  try {
    const d = await api("POST","/api/ai",{prompt, tier: opts.tier||"default", maxTokens: opts.maxTokens});
    if (d.budget){ S.budget=d.budget; budgetPill(); }
    return d.value;
  } catch(e){ if (e.budget){ S.budget=e.budget; budgetPill(); } throw e; }
}
function budgetPill(){
  const el=$("#budgetPill"); if(!el) return;
  if (!S.budget){ el.style.display="none"; return; }
  const b=S.budget, pct=b.spent/b.cap; el.style.display="";
  el.innerHTML=`<span class="dot ${pct>=1?"bad":pct>=.8?"warn":"ok"}"></span>AI budget: $${b.spent.toFixed(2)} of $${b.cap}`;
  el.title=`${b.calls} Claude calls in ${b.month}. Resets on the 1st.`;
}
const TRUTH_RULES = `HARD RULES — never break these:
- Use ONLY facts stated in MASTER RESUME. Never invent employers, job titles, dates, degrees, certifications, tools, metrics, numbers, team sizes, clients, or achievements.
- You may reorder, reword, condense and emphasize existing facts, and mirror the job's vocabulary ONLY where the resume genuinely supports it.
- If the job asks for something the resume does not show, list it as a gap. Do not imply she has it.
- Plain English, warm and confident, no clichés ("results-driven", "passionate", "synergy").`;
function fabricationCheck(text){
  // Flags numbers / percentages in generated text that do not appear in the master resume.
  const src = resumeText().toLowerCase();
  const nums = (text.match(/\$?\d[\d,.]*\s?(%|\+|k|m)?/gi)||[]).map(s=>s.trim()).filter(s=>s.replace(/\D/g,"").length);
  const bad = [...new Set(nums.filter(n=>{ const core=n.replace(/[^\d.]/g,""); return core && !src.includes(core); }))];
  const yearsClaim = (text.match(/\b\d+\+?\s+years?\b/gi)||[]).filter(y=>!src.includes(y.toLowerCase()));
  return [...new Set([...bad, ...yearsClaim])];
}

/* ===================== scoring (instant, rules-based) ===================== */
function quickScore(j){
  const txt = [j.title,j.summary,(j.requirements||[]).join(" "),(j.niceToHave||[]).join(" ")].join(" ").toLowerCase();
  const kws=["agile","scrum","jira","program","project","delivery","stakeholder","risk","capacity","cross-functional","product","ux","sprint","health","engineering","technical","roadmap","release","qa","ai","dependenc","kpi","metrics","saas","platform"];
  let s = 38 + kws.filter(k=>txt.includes(k)).length*3;
  const t=(j.title||"").toLowerCase();
  if (/technical (program|project)|delivery manager|project manager|program manager/.test(t)) s+=14;
  if (/product manager/.test(t)) s+=6;
  if (/director|vp|vice president|head of|principal/.test(t)) s-=18;
  if (/\b(8|9|10|12)\+?\s*years/.test(txt)) s-=10;
  if (/pmp/.test(txt) && !/pmp/i.test(resumeText())) s-=3;
  return Math.max(5, Math.min(95, Math.round(s)));
}
function scoreOf(j){ return j.match && typeof j.match.score==="number" ? j.match.score : quickScore(j); }
function priorityOf(j){ const s=scoreOf(j); return s>=80?"High":s>=65?"Medium":"Low"; }

/* ===================== Today: action engine ===================== */
function buildActions(){
  const A=[]; const add=(impact,urgency,effort,o)=>A.push({...o, rank: impact*urgency/effort});
  if (!S.prefs || !S.prefs.confirmed) add(5,5,1,{t:"Confirm your job-search preferences",w:"Salary floor, remote/hybrid, relocation — 2 minutes and every score gets sharper.",btn:"Set preferences",act:"openOnboard"});
  if (S.prefs && S.prefs.confirmed && S.prefs.missionPriority===undefined) add(5,5,1,{t:"💚 Tell the Lab what kind of mission matters to you",w:"Nonprofit, public health, education… it will steer the search and scores.",btn:"Set mission focus",act:"openOnboard"});
  if (!resumeText()) add(5,5,2,{t:"Add your master resume",w:"Everything tailored is built only from this.",btn:"Add resume",act:"openResume"});
  for (const r of S.inbox.filter(x=>!x.handled)) add(5,5,1,{t:`Reply to ${r.company||"recruiter"}`,w:r.subject,btn:"Open email",href:r.url,act:"markInbox",id:r.id});
  for (const j of S.jobs){
    if (j.hidden||j.expired) continue;
    if (j.snoozedUntil && daysUntil(j.snoozedUntil)>0) continue;
    const sc=scoreOf(j), name=`${j.title} · ${j.company}`;
    (j.interviews||[]).forEach(iv=>{ const d=daysUntil(iv.date); if(d!=null&&d>=0&&d<=7) add(5,d<=2?5:3,2,{t:`Prep for ${iv.label||"interview"} — ${j.company}`,w:`${fmtD(iv.date)} · ${j.title}`,btn:"Open prep",act:"openJob",id:j.id}); });
    if (j.deadline){ const d=daysUntil(j.deadline); if(d!=null&&d>=0&&d<=5&&!ACTIVE_AFTER_APPLY.includes(j.stage)) add(4,5,2,{t:`Deadline in ${d} day${d===1?"":"s"}: ${j.company}`,w:j.title,btn:"Prepare application",act:"goApply",id:j.id}); }
    if (followDue(j)) add(4,4,1,{t:`Follow up with ${j.company}`,w:`Applied ${fmtD(j.appliedAt)} · ${j.title}`,btn:"Draft follow-up",act:"draftFollow",id:j.id});
    else if (isStalled(j)) add(3,3,1,{t:`${j.company} has gone quiet`,w:`No activity for ${daysSince(lastActivity(j))} days`,btn:"Draft follow-up",act:"draftFollow",id:j.id});
    if (j.stage==="Preparing" && j.kit) add(5,4,1,{t:`Submit your application to ${j.company}`,w:"Kit is ready — review it, submit on their site, then mark it applied.",btn:"Review & submit",act:"goApply",id:j.id});
    if (j.stage==="Shortlisted") add(4,3,2,{t:`Tailor your resume for ${j.company}`,w:name,btn:"Tailor resume",act:"goApply",id:j.id});
    if (j.stage==="Discovered" && sc>=72) add(sc>=82?4:3,(daysSince(j.foundAt||j.createdAt)||0)<=3?4:2,1,{t:`New ${sc}% match: ${j.company}`,w:j.title,btn:"Review job",act:"openJob",id:j.id,score:sc});
  }
  for (const c of S.contacts){ if (c.nextFollowUp && daysUntil(c.nextFollowUp)<=0) add(3,4,1,{t:`Check in with ${c.name}`,w:`${c.role||""}${c.company?" · "+c.company:""}`,btn:"Draft message",act:"openContact",id:c.id}); }
  return A.sort((a,b)=>b.rank-a.rank);
}

/* ===================== render: shell ===================== */
function render(){
  budgetPill();
  const cnt = {discover:S.jobs.filter(j=>j.stage==="Discovered"&&!j.hidden&&!j.expired).length, apply:S.jobs.filter(j=>["Shortlisted","Preparing"].includes(j.stage)).length, pipeline:S.jobs.filter(j=>ACTIVE_AFTER_APPLY.includes(j.stage)).length};
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" data-act="tab" data-id="${k}">${l}${cnt[k]?`<span class="ct">${cnt[k]}</span>`:""}</button>`).join("");
  const v = {today:vToday, discover:vDiscover, apply:vApply, pipeline:vPipeline, network:vNetwork, analytics:vAnalytics}[S.tab];
  const focus = document.activeElement && document.activeElement.id; const sel = focus && document.activeElement.selectionStart;
  const sy = window.scrollY;
  if (S.mode==="loading" || (!S.loaded.jobs && S.mode==="db")) { $("#view").innerHTML = `<div class="card"><div class="row"><span class="spin dark"></span> Getting your Lab ready…</div></div>`; return; }
  $("#view").innerHTML = v();
  if (focus){ const el=document.getElementById(focus); if(el){ el.focus(); try{ if(sel!=null) el.setSelectionRange(sel,sel);}catch(e){} } }
  window.scrollTo(0, sy);
  afterRender();
}
function afterRender(){
  // drag & drop for pipeline
  document.querySelectorAll(".pcard").forEach(c=>c.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",c.dataset.id);}));
  document.querySelectorAll(".lane").forEach(l=>{
    l.addEventListener("dragover",e=>{e.preventDefault(); l.classList.add("over");});
    l.addEventListener("dragleave",()=>l.classList.remove("over"));
    l.addEventListener("drop",e=>{e.preventDefault(); l.classList.remove("over"); const id=e.dataTransfer.getData("text/plain"); moveStage(id,l.dataset.stage);});
  });
}

/* ===================== TODAY ===================== */
function vToday(){
  const A = buildActions(), top = A.slice(0,5);
  const fresh = S.jobs.filter(j=>j.stage==="Discovered"&&!j.hidden&&!j.expired&&scoreOf(j)>=70).sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,4);
  const follow = S.jobs.filter(j=>followDue(j)||isStalled(j));
  const ready = S.jobs.filter(j=>j.stage==="Preparing");
  const upcoming = [];
  S.jobs.forEach(j=>{ (j.interviews||[]).forEach(iv=>{ if(daysUntil(iv.date)>=0) upcoming.push({d:iv.date,t:`${iv.label||"Interview"} — ${j.company}`,id:j.id}); }); if(j.deadline&&daysUntil(j.deadline)>=0&&!ACTIVE_AFTER_APPLY.includes(j.stage)) upcoming.push({d:j.deadline,t:`Application deadline — ${j.company}`,id:j.id}); });
  S.events.forEach(ev=>upcoming.push({d:ev.start,t:ev.title+" (calendar)",href:ev.url}));
  upcoming.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  const applied7 = S.jobs.filter(j=>j.appliedAt && daysSince(j.appliedAt)<=7).length;
  const disc7 = S.jobs.filter(j=>daysSince(j.foundAt||j.createdAt)<=7).length;
  const interviewing = S.jobs.filter(j=>["Interviewing","Final Round"].includes(j.stage)).length;
  const lastRun = S.log.find(l=>l.type==="discovery");
  return `
  <div class="card hero"><div class="bubbles"></div>
    <h2>${greeting()}, ${h((S.prefs&&S.prefs.name)||"Claire")}! ${top.length?"Here’s your game plan.":"You’re all caught up."}</h2>
    <p>${top.length? `Do the ${Math.min(5,top.length)} thing${top.length>1?"s":""} below, in order — they’re ranked by how much they move the needle, how urgent they are, and how quick they are.` : "Nothing urgent today. Browse new matches or reach out to someone in your network."}</p>
    <div class="stats">
      <span class="stat"><b>${disc7}</b>new jobs this week</span>
      <span class="stat"><b>${applied7}</b>applied this week</span>
      <span class="stat"><b>${interviewing}</b>in interviews</span>
      <span class="stat"><b>${S.jobs.filter(j=>ACTIVE_AFTER_APPLY.includes(j.stage)).length}</b>active applications</span>
    </div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card">
      <h3>🎯 Top 5 for today <span class="sub">${A.length} open action${A.length===1?"":"s"}</span></h3>
      ${top.length? top.map((a,i)=>`
        <div class="action"><div class="num">${i+1}</div>
          <div class="body"><div class="t">${h(a.t)}</div><div class="w">${h(a.w||"")}</div></div>
          <div class="row">
            ${a.href?`<a class="btn coral sm" href="${h(a.href)}" target="_blank" rel="noopener">${h(a.btn)}</a>`:`<button class="btn coral sm" data-act="${a.act}" data-id="${h(a.id||"")}">${h(a.btn)}</button>`}
            ${a.id && a.act!=="openContact" && a.act!=="markInbox" ? `<button class="btn ghost sm" data-act="snooze" data-id="${h(a.id)}" title="Hide from today">Later</button>`:""}
            ${a.act==="markInbox"?`<button class="btn ghost sm" data-act="markInbox" data-id="${h(a.id)}">Mark complete</button>`:""}
          </div>
        </div>`).join("") : `<div class="empty">🎉 Nothing pressing. Check Discover for fresh matches.</div>`}
    </div>
    <div class="col">
      <div class="card">
        <h3>✨ New high matches <span class="sub"><a href="#discover" data-act="tab" data-id="discover">See all</a></span></h3>
        ${fresh.length? fresh.map(j=>`<div class="mini"><div><div class="t">${h(j.title)}</div><div class="small muted">${h(j.company)} · ${h(j.workMode||"")}${(j.salaryMin||j.salaryMax)?" · "+[money(j.salaryMin),money(j.salaryMax)].filter(Boolean).join("–"):""}</div></div><button class="btn ghost sm" data-act="openJob" data-id="${j.id}">${scoreOf(j)}%</button></div>`).join("") : `<div class="empty small">No new 70%+ matches yet. ${lastRun?"Last search "+fmtD(lastRun.at)+".":"The daily search adds them here."}</div>`}
      </div>
      <div class="card">
        <h3>📅 Coming up</h3>
        ${upcoming.length? upcoming.slice(0,6).map(u=>`<div class="mini"><div class="t">${h(u.t)}</div><span class="chip sky">${fmtD(u.d)}</span></div>`).join("") : `<div class="empty small">No interviews or deadlines on the books.</div>`}
        <div class="tiny muted" style="margin-top:8px">Add interviews and deadlines from a job’s details panel.</div>
      </div>
    </div>
  </div>

/* ===================== DISCOVER ===================== */
function filteredJobs(){
  const f=S.ui.filters, q=f.q.toLowerCase();
  return S.jobs.filter(j=>{
    if (j.stage!=="Discovered" && j.stage!=="Shortlisted") return false;
    if (j.hidden && !f.showHidden) return false;
    if (j.expired && !f.showExpired) return false;
    if (q && !(`${j.title} ${j.company} ${j.location} ${j.industry}`.toLowerCase().includes(q))) return false;
    if (f.minScore && scoreOf(j)<f.minScore) return false;
    if (f.minSalary && !( (j.salaryMax||j.salaryMin||0) >= Number(f.minSalary)*1000 )) return false;
    if (f.mode && j.workMode!==f.mode) return false;
    if (f.seniority && j.seniority!==f.seniority) return false;
    if (f.cat && j.category!==f.cat) return false;
    if (f.missionOnly && !(j.mission && j.mission.driven)) return false;
    return true;
  }).sort((a,b)=>scoreOf(b)-scoreOf(a));
}

  const np = j.mission && j.mission.verifiedNonprofit;
  return `<div class="card jobcard" id="job-${j.id}">
    <div class="ring" style="--p:${sc};--c:${scoreColor(sc)}"><span>${sc}</span></div>

      <div class="jobmeta">${h(j.company)} · ${h(j.location||"")} ${j.workMode?`· <b>${h(j.workMode)}</b>`:""} ${salaryText(j)?`· 💰 ${h(salaryText(j))}`:`· <span class="muted">salary not published</span>`}</div>

        ${np?`<a class="chip teal" style="text-decoration:none" href="${h(np.url)}" target="_blank" rel="noopener" title="IRS records via ProPublica: ${h(np.name)}, ${h(np.city||"")} ${h(np.state||"")}">✓ Registered nonprofit</a>`:""}
        ${j.mission&&j.mission.driven?`<span class="chip teal" title="${h(j.mission.note||"")}">💚 ${h(np?"Mission":(j.mission.type||"Mission-driven"))}${j.mission.cause?" · "+h(j.mission.cause):""}</span>`:""}
        ${j.category?`<span class="chip sky">${h(j.category)}</span>`:""}

        : `<div class="why"><b>Quick score</b> from keywords. <button class="btn lilac sm" data-act="aiScore" data-id="${j.id}" style="margin-left:6px">${S.ui.busy["score"+j.id]?'<span class="spin"></span>':"✨"} Get Claude’s take</button></div>`}
      ${full && j.summary?`<p class="small" style="margin:10px 0 0">${h(j.summary)}</p>`:""}

    </div>

    const shown = s==="Discovered"? js.sort((a,b)=>scoreOf(b)-scoreOf(a)).slice(0,12) : js;
    return `<div class="lane" data-stage="${s}"><h4><span>${stageLabel(s)}</span><span class="chip">${js.length}</span></h4>
      ${shown.map(j=>`<div class="pcard ${isStalled(j)?"stalled":""}" draggable="true" data-id="${j.id}" data-act="openJob">
        <div class="c">${h(j.company)}</div><div class="t">${h(j.title)}</div>
        <div class="row" style="gap:4px;margin-top:6px"><span class="chip">${scoreOf(j)}%</span>${isStalled(j)?`<span class="chip coral">Stalled</span>`:""}${followDue(j)?`<span class="chip sun">Follow up</span>`:""}${(j.interviews||[]).some(iv=>daysUntil(iv.date)>=0)?`<span class="chip sky">Interview</span>`:""}</div>
      </div>`).join("")}
      ${s==="Discovered"&&js.length>12?`<div class="tiny muted" style="text-align:center">+${js.length-12} more in Discover</div>`:""}
    </div>`;}).join("");
  return `<div class="card" style="margin-bottom:14px"><div class="row between"><div><h3 style="margin:0">🗂️ Your pipeline</h3><div class="small muted">Drag cards between stages, or click one for its full history. Follow-ups are suggested 7 days after applying; anything quiet for 14+ days is flagged.</div></div><button class="btn ghost sm" data-act="addManual">＋ Add a job I found</button></div></div><div class="board">${lanes}</div>`;
}
function moveStage(id, stage){
  const j=jobById(id); if(!j||j.stage===stage) return;
  if (stage==="Applied" && !ACTIVE_AFTER_APPLY.includes(j.stage)) return confirmApplied(id);
  const from=j.stage; j.stage=stage; addHistory(j,`Moved from ${stageLabel(from)} to ${stageLabel(stage)}`);
  if (RESPONDED.includes(stage) && !j.respondedAt) j.respondedAt=now();
  if (stage==="Recruiter Contact"||stage==="Interviewing") j.followUpDate=addDays(5);
  if (stage==="Closed"||stage==="Offer") j.followUpDate=null;
  saveJob(j); toast(`${j.company} → ${stageLabel(stage)}`);
}

/* ===================== ANALYTICS ===================== */
function vAnalytics(){
  const J=S.jobs, applied=J.filter(j=>j.appliedAt), resp=applied.filter(j=>j.respondedAt||RESPONDED.includes(j.stage));
  const inter=J.filter(j=>["Interviewing","Final Round","Offer"].includes(j.stage)||(j.interviews||[]).length), offers=J.filter(j=>j.stage==="Offer"||j.offer);
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"—";
  const funnel=[["Discovered",J.length],["Shortlisted+",J.filter(j=>STAGES.indexOf(j.stage)>=1&&j.stage!=="Closed"||j.appliedAt).length],["Applied",applied.length],["Got a response",resp.length],["Interviewed",inter.length],["Offers",offers.length]];
  const maxF=Math.max(1,...funnel.map(f=>f[1]));
  const sal=J.filter(j=>j.salaryMin||j.salaryMax).map(j=>((j.salaryMin||j.salaryMax)+(j.salaryMax||j.salaryMin))/2);
  const buckets={}; sal.forEach(s=>{const b=Math.floor(s/20000)*20; buckets[b]=(buckets[b]||0)+1;});
  const bk=Object.keys(buckets).map(Number).sort((a,b)=>a-b), maxB=Math.max(1,...Object.values(buckets));
  const groupBy=(key)=>{ const g={}; J.forEach(j=>{const k=j[key]||"Other"; g[k]=g[k]||{n:0,a:0,r:0,i:0}; g[k].n++; if(j.appliedAt)g[k].a++; if(j.appliedAt&&(j.respondedAt||RESPONDED.includes(j.stage)))g[k].r++; if(["Interviewing","Final Round","Offer"].includes(j.stage)||(j.interviews||[]).length)g[k].i++;}); return Object.entries(g).sort((a,b)=>b[1].n-a[1].n); };
  const tbl=(rows)=>`<table class="t"><tr><th></th><th>Found</th><th>Applied</th><th>Response</th><th>Interviews</th></tr>${rows.map(([k,v])=>`<tr><td><b>${h(k)}</b></td><td>${v.n}</td><td>${v.a}</td><td>${pct(v.r,v.a)}</td><td>${v.i}</td></tr>`).join("")}</table>`;
  const best = groupBy("category").filter(([k,v])=>v.a>=2).sort((a,b)=>(b[1].r/b[1].a)-(a[1].r/a[1].a))[0];
  return `<div class="grid g4">
    ${[["Jobs discovered",J.length,"var(--sky)"],["Applications sent",applied.length,"var(--coral)"],["Response rate",pct(resp.length,applied.length),"var(--teal)"],["Interview rate",pct(inter.length,applied.length),"var(--lilac)"]].map(k=>`<div class="card kpi"><div class="v" style="color:${k[2]}">${k[1]}</div><div class="l">${k[0]}</div></div>`).join("")}
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>🪜 Your funnel</h3>${funnel.map(f=>`<div style="margin-bottom:10px"><div class="row between small"><b>${f[0]}</b><span>${f[1]}</span></div><div class="bar"><i style="width:${f[1]/maxF*100}%;background:${["var(--sky)","var(--lilac)","var(--coral)","var(--sun)","var(--teal)","var(--rose)"][funnel.indexOf(f)]}"></i></div></div>`).join("")}
      <div class="small muted">Offers: ${offers.length} · Interview → offer: ${pct(offers.length,inter.length)}</div></div>
    <div class="card"><h3>💰 Pay ranges in your target roles <span class="sub">${sal.length} with published pay</span></h3>
      ${bk.length? `<div style="display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:6px">${bk.map(b=>`<div style="flex:1;max-width:70px;text-align:center"><div style="height:${buckets[b]/maxB*120}px;background:linear-gradient(180deg,#FFB08F,#FF6B4A);border-radius:8px 8px 4px 4px"></div><div class="tiny muted" style="margin-top:4px">$${b}–${b+20}k</div><div class="tiny"><b>${buckets[b]}</b></div></div>`).join("")}</div><div class="small muted" style="margin-top:8px">Midpoint of each published range. Median: <b>${money(sal.sort((a,b)=>a-b)[Math.floor(sal.length/2)])}</b></div>`:`<div class="empty small">No published salaries yet.</div>`}
    </div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>🧩 By role type</h3>${tbl(groupBy("category"))}</div>
    <div class="card"><h3>🌐 By source</h3>${tbl(groupBy("source"))}</div>
  </div>
  <div class="card" style="margin-top:16px"><h3>💡 What the numbers say</h3><div class="small">
    ${applied.length<5? "Too early to call — after about 5 applications, this will show which role types and sources are actually getting replies, and the daily search will lean into them." : best? `<b>${h(best[0])}</b> roles are replying most (${pct(best[1].r,best[1].a)}). Prioritize them in Discover.` : "Responses are evenly spread so far — keep applying across role types."}
  </div></div>`;
}

async function makeDocx(text){
  if(!window.docx) await loadScript("/vendor/docx.js");
  const D=window.docx, SECTIONS=/^(profile|summary|skills|work experience|experience|education|volunteer|projects|certifications)$/i;
  const lines=text.replace(/\r/g,"").split("\n"); const paras=[];
  lines.forEach((ln,i)=>{
    const t=ln.trim();
    if(!t){ paras.push(new D.Paragraph({spacing:{after:60}})); return; }
    if(i===0) return paras.push(new D.Paragraph({alignment:D.AlignmentType.CENTER,children:[new D.TextRun({text:t,bold:true,size:32})]}));
    if(SECTIONS.test(t.replace(/[:\s]+$/,""))||(t===t.toUpperCase()&&t.length<40&&/[A-Z]/.test(t)))
      return paras.push(new D.Paragraph({spacing:{before:200,after:80},border:{bottom:{style:D.BorderStyle.SINGLE,size:6,color:"999999",space:2}},children:[new D.TextRun({text:t.toUpperCase(),bold:true,size:22})]}));
    if(/^[•\-\*–]\s*/.test(t)) return paras.push(new D.Paragraph({bullet:{level:0},spacing:{after:40},children:[new D.TextRun({text:t.replace(/^[•\-\*–]\s*/,""),size:20})]}));
    const bold = /\|/.test(t) && t.length<140;
    paras.push(new D.Paragraph({spacing:{after:40},alignment:i<3&&lines[0]&&!bold?D.AlignmentType.CENTER:D.AlignmentType.LEFT,children:[new D.TextRun({text:t,bold,size:20})]}));
  });
  const doc=new D.Document({styles:{default:{document:{run:{font:"Calibri"}}}},sections:[{properties:{page:{margin:{top:720,bottom:720,left:864,right:864}}},children:paras}]});
  return await D.Packer.toBlob(doc);
}
async function makePdf(text){
  if(!window.jspdf) await loadScript("/vendor/jspdf.js");
  const pdf=new window.jspdf.jsPDF({unit:"pt",format:"letter"}); const W=612-108; let y=60;
  const lines=text.replace(/\r/g,"").replace(/[•]/g,"-").replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[‘’]/g,"'").split("\n");
  lines.forEach((ln,i)=>{
    const t=ln.trim(); const head=i===0, sec=t && t===t.toUpperCase() && t.length<40 && /[A-Z]/.test(t);
    pdf.setFont("helvetica", head||sec?"bold":"normal"); pdf.setFontSize(head?16:sec?11:10);
    if(!t){ y+=6; return; }
    if(sec){ y+=6; }
    pdf.splitTextToSize(t, W).forEach(part=>{ if(y>740){ pdf.addPage(); y=60; } pdf.text(part, head?306:54, y, head?{align:"center"}:undefined); y+= head?20:13; });
    if(sec){ pdf.setDrawColor(170); pdf.line(54,y-9,558,y-9); y+=2; }
  });
  return pdf.output("blob");
}

    <label class="field" style="margin-top:8px">Remind me to follow up in<select id="ap_follow"><option value="5">5 days</option><option value="7" selected>7 days</option><option value="10">10 days</option></select></label>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn ghost" data-act="closeOverlay">Not yet</button><button class="btn teal" data-act="markApplied" data-id="${j.id}">Yes, I applied</button></div>
  </div></div>`;
}
function addHistoryC(c,text){ c.history=c.history||[]; c.history.push({at:now(),text}); }

/* ===================== Ask Claude ===================== */
function md(t){
  let x=h(t);
  x=x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines=x.split("\n"); let out="", inList=false;
  for(const ln of lines){ const m=ln.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if(m){ if(!inList){ out+="<ul>"; inList=true; } out+=`<li>${m[1]}</li>`; }
    else { if(inList){ out+="</ul>"; inList=false; } if(ln.trim()) out+=`<p>${ln}</p>`; } }
  return out+(inList?"</ul>":"");
}
const QUICK=[["☀️","What should I focus on today?"],["💚","Search the impact job boards for roles like mine"],["🔍","Which of my jobs are mission-driven?"],["🎤","Help me prep for an interview"],["✍️","Walk me through tailoring my resume"],["🧭","Is this company actually doing good?"]];
const SPARK_SVG = document.querySelector("#askBtn .spark").innerHTML;
const CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#11A086" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
function renderChat(){
  const box=$("#askMsgs"); if(!box) return;
  const msgs=S.chat||[];
  if(!msgs.length && !S.chatBusy){
    box.innerHTML=`<div class="welcome">${SPARK_SVG.replace('width="22" height="22"','width="34" height="34"')}<h3>Hi ${h((S.prefs&&S.prefs.name)||"Claire")}, how can I help?</h3><p>Ask me anything, or tell me what to do — I can search, update your pipeline, add contacts, or walk you through any part of the Lab.</p>
      <div class="sugg">${QUICK.map(([e,q])=>`<button data-act="askQuick" data-q="${h(q)}"><span>${e}</span>${h(q)}</button>`).join("")}</div></div>`;
    return;
  }
  box.innerHTML = msgs.map(m=> m.role==="user"
      ? `<div class="m-user">${h(m.content)}</div>`
      : `<div class="m-ai"><div class="av">${SPARK_SVG}</div><div class="tx">${md(m.content)}${(m.changes&&m.changes.length)?`<div class="acts-done">${m.changes.map(c=>`<div>${CHECK_SVG}<span>${h(c)}</span></div>`).join("")}</div>`:""}</div></div>`).join("")
    + (S.chatBusy? `<div class="m-ai"><div class="av">${SPARK_SVG}</div><div class="tx"><span class="thinking">Thinking…</span></div></div>`:"");
  box.scrollTop=box.scrollHeight;
}
function askOpen(){ $("#askPanel").classList.add("open"); $("#askScrim").classList.add("open"); $("#askPanel").setAttribute("aria-hidden","false"); $("#askBtn").style.display="none"; renderChat(); setTimeout(()=>$("#askIn").focus(),120); }
function askClose(){ $("#askPanel").classList.remove("open"); $("#askScrim").classList.remove("open"); $("#askPanel").setAttribute("aria-hidden","true"); $("#askBtn").style.display=""; }
function askGrow(){ const t=$("#askIn"); t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,180)+"px"; $("#askSendBtn").disabled=!t.value.trim()||S.chatBusy; }
document.addEventListener("input", e=>{ if(e.target && e.target.id==="askIn") askGrow(); });
document.addEventListener("keydown", e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); $("#askPanel").classList.contains("open")? askClose() : askOpen(); }
  if(e.key==="Escape" && $("#askPanel").classList.contains("open")){ askClose(); }
});
if(!/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent)) $("#askKbd").textContent="Ctrl K";
if(window.matchMedia && matchMedia("(pointer:coarse)").matches) $("#askKbd").style.display="none";
async function askSend(text){
  const inp=$("#askIn"); text=(text||inp.value).trim(); if(!text||S.chatBusy) return;
  if(S.mode!=="db"){ toast("Ask Claude needs the Lab server."); return; }
  inp.value=""; S.chat=[...(S.chat||[]), {role:"user", content:text, at:now()}]; S.chatBusy=true; askGrow(); renderChat();
  try{
    const r=await api("POST","/api/chat",{messages:S.chat.map(m=>({role:m.role, content:m.content}))});
    S.chat=[...S.chat, {role:"assistant", content:r.reply, changes:r.changes, at:now()}];
    if(r.budget){ S.budget=r.budget; budgetPill(); }
    S.chatBusy=false; askGrow(); renderChat();
    if((r.changes||[]).length || (r.ui||[]).length){ applyState(await api("GET","/api/state")); render(); }
    for(const u of r.ui||[]) runUi(u);
  }catch(e){
    S.chatBusy=false; askGrow(); if(e.budget){ S.budget=e.budget; budgetPill(); }
    S.chat=[...S.chat, {role:"assistant", content: e.code==="budget"? e.message : "Sorry — I hit a snag: "+(e.message||"unknown error")+". Try again in a moment.", at:now()}]; renderChat();
  }
}
function runUi(u){
  if(!u) return;
  if(window.innerWidth<900) askClose();
  if(u.view==="settings") return openSettings();
  if(u.view==="resume") return openResume();
  if(u.view==="preferences") return openOnboard();
  if(TABS.some(t=>t[0]===u.view)){ S.tab=u.view; location.hash=u.view; }
  if(u.action==="build_kit" && u.jobId){ S.tab="apply"; location.hash="apply"; S.ui.applyJob=u.jobId; S.ui.applySub="fit"; render(); const j=jobById(u.jobId); if(j && !j.kit) genKit(u.jobId); return; }
  if(u.view==="apply" && u.jobId){ S.ui.applyJob=u.jobId; }
  render(); window.scrollTo(0,0);
  if((u.action==="open_job"||u.jobId) && u.view!=="apply") openJob(u.jobId);
  if(u.contactId) openContact(u.contactId);
}
document.addEventListener("keydown", e=>{ if(e.target && e.target.id==="askIn" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); askSend(); } });

/* ===================== event delegation ===================== */
document.addEventListener("click", async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if (el.classList.contains("scrim") && e.target!==el) return; // clicks inside drawer
  const act=el.dataset.act, id=el.dataset.id;
  if (el.tagName==="A" && act!=="tab") return;
  if (act==="tab"){ e.preventDefault(); S.tab=id; location.hash=id; closeOverlay(); render(); window.scrollTo(0,0); return; }
  const j=id&&jobById(id);
  switch(act){
    case "closeOverlay": closeOverlay(); break;
    case "openSettings": openSettings(); break;
    case "openOnboard": openOnboard(); break;
    case "openResume": openResume(); break;
    case "openJob": openJob(id); break;
    case "openContact": openContact(id); break;
    case "newContact": openContact(null); break;
    case "addContactFor": openContact(null,{company:j.company,jobId:j.id}); break;
    case "goApply": closeOverlay(); S.tab="apply"; location.hash="apply"; S.ui.applyJob=id; S.ui.applySub="fit"; if(j&&j.stage==="Discovered"){ j.stage="Shortlisted"; addHistory(j,"Shortlisted"); saveJob(j); } render(); window.scrollTo(0,0); break;
    case "pickApply": S.ui.applyJob=id; S.ui.applySub="fit"; render(); break;
    case "applySub": S.ui.applySub=id; render(); break;
    case "shortlist": j.stage="Shortlisted"; addHistory(j,"Shortlisted"); saveJob(j); toast("★ Shortlisted — tailor it in Apply"); break;
    case "hide": j.hidden=true; if(["Shortlisted","Preparing"].includes(j.stage)) j.stage="Discovered"; addHistory(j,"Marked not for me"); saveJob(j); closeOverlay(); toast("Hidden — find it under “Show hidden” in Discover"); break;
    case "unshortlist": { e.stopPropagation(); j.stage="Discovered"; addHistory(j,"Removed from shortlist"+(j.kit?" (application kit kept)":"")); if(S.ui.applyJob===id) S.ui.applyJob=null; saveJob(j); closeOverlay(); toast("Removed from your shortlist — it’s back in Discover"); break; }
    case "unhide": j.hidden=false; saveJob(j); break;
    case "snooze": if(j){ j.snoozedUntil=addDays(1); addHistory(j,"Snoozed from Today"); saveJob(j); toast("Snoozed until tomorrow");} break;
    case "markInbox": { const r=S.inbox.find(x=>x.id===id); if(r){ r.handled=true; render(); } break; }
    case "aiScore": aiScore(id); break;
    case "importJob": importJob(); break;
    case "genKit": genKit(id); break;
    case "saveKit": collectKitEdits(j); delete S.ui.dirty[j.id]; j.versions=j.versions||[]; const last=j.versions[j.versions.length-1]; if(!last||last.resume!==j.kit.tailoredResume) j.versions.push({n:j.versions.length+1,at:now(),resume:j.kit.tailoredResume}); addHistory(j,"Edited application materials"); await saveJob(j).catch(()=>{}); toast("Saved"); break;
    case "copyField": collectKitEdits(j); copy(getPath(j.kit, el.dataset.field)||""); break;
    case "copyText": copy(el.dataset.text||""); break;
    case "copyEl": copy(($("#"+el.dataset.el)||{}).value||""); break;
    case "downloadDoc": collectKitEdits(j); download(`Claire DeSmith - ${j.company} - ${el.dataset.field==="coverLetter"?"Cover Letter":"Resume"}`, getPath(j.kit, el.dataset.field)||"", el.dataset.kind); break;
    case "downloadMaster": download("Claire DeSmith - Resume", $("#res_text").value, el.dataset.kind); break;
    case "confirmApplied": confirmApplied(id); break;
    case "markApplied": { const d=$("#ap_date").value||addDays(0), f=Number($("#ap_follow").value||7);
      j.stage="Applied"; j.appliedAt=new Date(d+"T12:00:00").toISOString(); j.followUpDate=addDays(f,new Date(d+"T12:00:00")); addHistory(j,`Applied (submitted by Claire) — follow-up set for ${fmtD(j.followUpDate)}`);
      closeOverlay(); await saveJob(j).catch(()=>{}); toast("🎉 Logged! Follow-up reminder set."); break; }
    case "saveDrawer": { const st=$("#dr_stage").value; j.followUpDate=$("#dr_follow").value||null; j.deadline=$("#dr_deadline").value||null; j.source=$("#dr_source").value; if(st!==j.stage){ closeOverlay(); moveStage(id,st); } else { addHistory(j,"Updated dates"); await saveJob(j).catch(()=>{}); openJob(id);} toast("Saved"); break; }
    case "addInterview": { const l=$("#iv_label").value.trim()||"Interview", d=$("#iv_date").value; if(!d){toast("Pick a date");break;} j.interviews=j.interviews||[]; j.interviews.push({label:l,date:d}); addHistory(j,`Interview scheduled: ${l} on ${fmtD(d)}`); if(!["Interviewing","Final Round","Offer"].includes(j.stage)){ j.stage="Interviewing"; if(!j.respondedAt) j.respondedAt=now(); } await saveJob(j).catch(()=>{}); openJob(id); break; }
    case "rmInterview": j.interviews.splice(Number(el.dataset.i),1); await saveJob(j).catch(()=>{}); openJob(id); break;
    case "addNote": { const t=$("#note_in").value.trim(); if(!t) break; addHistory(j,"📝 "+t); await saveJob(j).catch(()=>{}); openJob(id); break; }
    case "addManual": { S.tab="discover"; location.hash="discover"; render(); window.scrollTo(0,0); setTimeout(()=>{const t=$("#imp_url"); if(t) t.focus();},50); toast("Paste the posting link and description to add it."); break; }
    case "savePrefs": { const v=x=>($("#"+x)||{}).value||""; const p={...(S.prefs||defaultPrefs()), name:v("p_name")||"Claire", location:v("p_loc"), minSalary:v("p_sal"), relocation:v("p_rel"), preferredMode:v("p_pref"), workModes:[...document.querySelectorAll(".p_mode:checked")].map(x=>x.value), seniority:[...document.querySelectorAll(".p_sen:checked")].map(x=>x.value), targetTitles:v("p_titles").split(",").map(s=>s.trim()).filter(Boolean), industries:v("p_ind"), avoid:v("p_avoid"), missionPriority:v("p_mpri")||"No preference", missionFocus:[...document.querySelectorAll(".p_cause:checked")].map(x=>x.value), confirmed:true, updatedAt:now()};
      const missionChanged = JSON.stringify([p.missionPriority,p.missionFocus])!==JSON.stringify([(S.prefs||{}).missionPriority,(S.prefs||{}).missionFocus]);
      closeOverlay(); await savePrefs(p).catch(()=>{}); if(p.minSalary) S.ui.filters.minSalary=""; toast("Preferences saved ✨"); logEvent("settings","Updated job-search preferences");
      if (missionChanged && S.jobs.some(j=>["Discovered","Shortlisted","Preparing"].includes(j.stage))) setTimeout(()=>confirmRescore(),400); break; }
    case "saveResume": { const t=$("#res_text").value.trim(); if(!t){toast("Paste or upload your resume first.");break;} const st=$("#res_status"); await saveResume({text:t, updatedAt:now(), source:(st&&st.dataset.src)||(S.resume&&S.resume.source)||"Edited in Lab"}).catch(()=>{}); closeOverlay(); toast("Master resume saved"); logEvent("settings","Master resume updated"); break; }
    case "saveContact": { const v=x=>($("#"+x)||{}).value||""; const ex=S.contacts.find(x=>x.id===id); const c={...(ex||{id, history:[], createdAt:now()}), name:v("ct_name")||"Unnamed", role:v("ct_role"), company:v("ct_company"), jobId:v("ct_job"), email:v("ct_email").trim(), linkedin:v("ct_li").trim(), how:v("ct_how"), nextFollowUp:v("ct_next")||null, referral:$("#ct_ref").checked, notes:v("ct_notes")};
      if(!ex) addHistoryC(c,"Added to your network"); await saveContact(c).catch(()=>{}); toast("Contact saved"); openContact(c.id); break; }
    case "draftMsg": draftMsg(id); break;
    case "mailto": { const c=S.contacts.find(x=>x.id===id); if(c&&c.email){ location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent($("#msg_subj").value)}&body=${encodeURIComponent($("#msg_body").value)}`; } break; }
    case "logSent": { const c=S.contacts.find(x=>x.id===id); const ch=$("#msg_ch").value, k=$("#msg_kind").value; c.draft={subject:$("#msg_subj").value, body:$("#msg_body").value}; addHistoryC(c,`Sent ${ch} message: ${k}`); c.lastContact=now(); c.nextFollowUp=addDays(7); await saveContact(c).catch(()=>{});
      const jj=jobById(c.jobId); if(jj){ addHistory(jj,`Reached out to ${c.name} (${ch})`); if(followDue(jj)) jj.followUpDate=addDays(7); saveJob(jj).catch(()=>{}); } toast("Logged — follow-up in 7 days"); openContact(id); break; }
    case "contactNote": { const c=S.contacts.find(x=>x.id===id); const t=$("#ct_noteadd").value.trim(); if(!t) break; addHistoryC(c,t); c.lastContact=now(); await saveContact(c).catch(()=>{}); openContact(id); break; }
    case "draftFollow": closeOverlay(); draftFollow(id); break;
    case "gotReply": moveStage(id,"Recruiter Contact"); break;
    case "runSearch": case "runSearchWeb": case "runImpact": { if(S.mode!=="db"){toast("Search needs the Lab server.");break;} S.ui.busy.search=true; render(); toast(act==="runImpact"?"Searching impact job boards — this can take 2–3 minutes…":act==="runSearchWeb"?"Searching the web — this can take a couple of minutes…":"Checking watched companies…");
      try{ const r=await api("POST","/api/discover",{webSearch:act==="runSearchWeb", impact:act==="runImpact", mission:!!S.ui.filters.missionOnly||act==="runImpact"}); applyState(await api("GET","/api/state")); toast(r.text); }catch(e){ toast(e.message||"Search failed"); }
      S.ui.busy.search=false; render(); break; }
    case "addBoard": { const url=$("#bd_url").value.trim(), name=$("#bd_name").value.trim(); if(!url){toast("Paste a careers link");break;}
      S.ui.busy.board=true; try{ const r=await api("POST","/api/boards/check",{url}); const list=[...S.boards.filter(x=>!(x.type===r.type&&x.token===r.token)), {type:r.type, token:r.token, company:name||r.token}]; S.boards=list; await queueWrite("config/boards",{list}); toast(`Added — ${r.openJobs} open job${r.openJobs===1?"":"s"} on their board right now`); }catch(e){ toast(e.message||"Couldn’t read that board"); }
      S.ui.busy.board=false; openSettings(); break; }
    case "rmBoard": { const list=S.boards.filter((_,i)=>i!==Number(el.dataset.i)); S.boards=list; await queueWrite("config/boards",{list}).catch(()=>{}); openSettings(); break; }
    case "rescore": confirmRescore(); break;
    case "askOpen": askOpen(); break;
    case "askClose": askClose(); break;
    case "askSend": askSend(); break;
    case "askQuick": if(!$("#askPanel").classList.contains("open")) askOpen(); askSend(el.dataset.q); break;
    case "askClear": if(S.chatBusy) break; S.chat=[]; renderChat(); api("DELETE","/api/chat").catch(()=>{}); break;
    case "doRescore": { closeOverlay(); S.ui.busy.rescore=true; render(); try{ const r=await api("POST","/api/rescore",{}); if(r.budget){S.budget=r.budget;} applyState(await api("GET","/api/state"));
        toast(r.rescored? `Checked ${r.rescored} jobs — ${r.missionDriven} mission-driven 💚${r.failed?` (${r.failed} couldn’t be checked)`:""}` : `Couldn’t check jobs${r.failed?` — ${r.failed} failed`:""}. Try again in a minute.`); }catch(e){ toast("Mission check failed: "+(e.message||"unknown error")); } S.ui.busy.rescore=false; render(); break; }
    case "addSuggested": { const sug=MISSION_BOARDS[Number(el.dataset.i)]; S.ui.busy["sug"+el.dataset.i]=true; openSettings();
      try{ const r=await api("POST","/api/boards/check",{url:sug.url}); const list=[...S.boards.filter(x=>!(x.type===r.type&&x.token===r.token)), {type:r.type, token:r.token, company:sug.name}]; S.boards=list; await queueWrite("config/boards",{list}); toast(`Watching ${sug.name} — ${r.openJobs} open job${r.openJobs===1?"":"s"} right now`); }
      catch(e){ toast(`Couldn’t find ${sug.name}’s board — they may use a different system. Add their careers link by hand.`); }
      S.ui.busy["sug"+el.dataset.i]=false; openSettings(); break; }
    case "exportData": copy(JSON.stringify({prefs:S.prefs,resume:S.resume,jobs:S.jobs,contacts:S.contacts},null,2)); break;
  }
});
document.addEventListener("input", e=>{
  const kf=e.target.dataset.kitfield;
  if (kf){ const j=jobById(e.target.dataset.id); if(j&&j.kit){ setPath(j.kit,kf,e.target.value); S.ui.dirty[j.id]=clone(j.kit); } return; }
  const f=e.target.dataset.filter; if(!f) return;
  S.ui.filters[f] = e.target.type==="checkbox"? e.target.checked : e.target.value; render();
});
document.addEventListener("change", e=>{ const f=e.target.dataset.filter; if(f){ S.ui.filters[f]= e.target.type==="checkbox"? e.target.checked : (f==="minScore"?Number(e.target.value):e.target.value); render(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeOverlay(); });
window.addEventListener("hashchange", ()=>{ const t=location.hash.replace("#",""); if(TABS.some(x=>x[0]===t)&&t!==S.tab){ S.tab=t; render(); } });

boot();
</script>
